  - week_number: 14
    title: "Self-Compassion & the Playbook"
    theme: >
      The consolidation week (Kristin Neff, CBT): self-compassion is the
      maintenance system that keeps every other tool working, because the
      program's most consistent finding is that shame fuels relapse while
      kind accountability fuels recovery. This week you run blameless
      post-mortems on your slips, correct the distorted thoughts that
      follow them, and write the personal willpower playbook you'll keep.
    microscope:
      text: >
        Observe your inner coach. After every slip, struggle, or win this
        week, listen to the voice that comments on it. Is it a drill
        sergeant, a defense lawyer, or a good coach? Catch the classic
        distortions: all-or-nothing ("ruined it"), mind-reading, fortune-
        telling ("I'll never change"). Just name them when they appear.
      daily_prompt: "What did your inner coach say after today's hardest moment — and would you let anyone talk to a friend that way?"
    experiment:
      text: >
        Run one blameless post-mortem daily: for any slip or near-slip,
        write the trigger, the thought, the action, and the counter-move
        for next time — zero verdicts on your character. Then add one page
        to your Willpower Playbook: your proven tools (from weeks 1-13),
        your danger conditions, and your recovery script. By Sunday the
        playbook is complete — that document is what you graduate with.
      daily_prompt: "Did you run today's post-mortem without a verdict? What line did you add to the playbook?"
    daily_prompts:
      - "What went into today's post-mortem — trigger, thought, action, counter-move?"
      - "Which thinking distortion showed up today, and what's the honest version of that thought?"
      - "What did self-compassion make possible today that self-criticism would have blocked?"
      - "Which three tools have earned a permanent spot in your playbook?"
      - "What are your top danger conditions, and what's the recovery script for each?"
      - "What would Week-1 you not believe about how you handled today?"
      - "The program ends tomorrow: what's your maintenance plan — the minimum practice that keeps this alive?"
